<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FIX: Added Google Fonts — was missing on this page -->

    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="navbar">
    <div class="container">
        <div class="logo">
            <h2>Pasta<span>House</span></h2>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" class="active">Menu</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="menu-page">
    <div class="container">
        <h2 class="section-title">Our Menu</h2>

        <div class="menu-grid">

            <div class="menu-card">
                <img src="images/pasta1.jpg" alt="Pasta Alfredo">
                <h3>Pasta Alfredo</h3>
                <p>Creamy white sauce pasta</p>
                <span>₹250</span>
                <button class="btn-primary">Add to Cart</button>
            </div>

            <div class="menu-card">
                <img src="images/pasta2.jpg" alt="Spaghetti">
                <h3>Spaghetti</h3>
                <p>Classic Italian spaghetti</p>
                <span>₹220</span>
                <button class="btn-primary">Add to Cart</button>
            </div>

            <div class="menu-card">
                <img src="images/pasta3.jpg" alt="Penne Arrabiata">
                <h3>Penne Arrabiata</h3>
                <p>Spicy tomato sauce</p>
                <span>₹240</span>
                <button class="btn-primary">Add to Cart</button>
            </div>

        </div>
    </div>
</section>

<footer class="footer">
    <p>© 2026 Pasta House</p>
</footer>
